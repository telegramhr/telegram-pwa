name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.event.pull_request.base.ref }}

            Review this pull request yourself, in this session. Do not delegate
            to agents or background tasks: this run ends when you stop, and
            anything still running is lost.

            1. Read the PR: `gh pr view ${{ github.event.pull_request.number }}` and
               `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`.
            2. Read the changed files in full where the diff is not enough, and
               the code they call. Read CLAUDE.md if it exists.
            3. Look for real problems only: bugs, wrong edge cases, race
               conditions, data loss, security issues (auth, injection, secrets,
               trusting client input for money), broken error handling, missing
               or wrong tests for the new behaviour. This is a Nuxt 2 SSR news
               site (Telegram.hr, Telesport) with a client-side paywall, gift
               links and CRM login: be strict about anything that can open
               premium content without access, leak user data, or break
               server-side rendering or the nginx page cache.
            4. Skip style, naming and formatting nits. Do not report anything
               you have not confirmed by reading the code.

            Report:
            - For each confirmed issue, post an inline comment on the exact line
              with mcp__github_inline_comment__create_inline_comment
              (confirmed: true): what is wrong, a concrete failure scenario,
              and the fix.
            - Always finish with exactly one summary comment via
              `gh pr comment ${{ github.event.pull_request.number }} --body "..."`,
              starting with "## Claude review", listing the issues by severity
              or saying plainly that none were found and what you checked.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Read,Grep,Glob" --disallowedTools "Agent,Task"'
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

